[pytest]
# Settings de Django usados SOLO por las pruebas unitarias (SQLite en memoria, sin Docker)
DJANGO_SETTINGS_MODULE = pruebas_unitarias.settings_pruebas

# Raíz del repo + carpeta de cada microservicio, para poder hacer:
#   from users.permissions import IsSuperadmin
#   from events.authentication import JWTUser
#   from queue_app.active_users import register_user_activity
pythonpath = . service-auth service-events service-queue

# Solo se ejecutan las pruebas unitarias de este equipo
testpaths = pruebas_unitarias
python_files = test_*.py
python_functions = cuando*

# Salida legible: muestra el nombre completo (descriptivo) de cada prueba
addopts = -v --tb=short --disable-warnings -p no:cacheprovider
